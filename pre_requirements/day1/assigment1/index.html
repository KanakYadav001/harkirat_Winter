<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html , body{
            height: 100%;
            width: 100%;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif 
        }
    </style>
</head>
<body>
    <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh;">
    <h3 style="margin-top: 20px;">IIElevenLabs</h3>

    <div style="display: flex; flex-direction: column; gap: 1rem ; flex:1; align-self: center; justify-content: center; width: 400px;">
        <h1>Create an account</h1>

        <div style="display: flex; border: 1px  solid rgb(194, 194, 194) ; width: auto;  height: 50px; align-items: center;   padding: 10px; border-radius: 20px;">
            <img src="./google.webp" alt="google_img"  style="height: fit-content; width: 30px;">
            <p style="margin-left: 70px;">Sign up with Google</p>
        </div>
        <div></div>

         <label for="email"><b>Email</b></label>
         <input type="text" id="email" placeholder="Enter your Email" style="padding: 10px;  border-radius: 10px;">
         <label for="password"><b>Password</b></label>
         <input type="password" id="password" placeholder="Enter Your Password" style="padding: 10px;  border-radius: 10px;" >

         <button style="background-color: rgb(70, 68, 68); color: white; padding: 10px; border: 2px; border-radius: 10px;">Sign up</button>

         <p style="align-self: center;">Already registered? Sign in</p>

    </div>

    <p style="margin-bottom: 20px;">By continuing, you agree to our Terms of Services and Privacy Policy</p>
    </div>
</body>
</html>
